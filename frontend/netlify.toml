[build]
  command = "npm run build && node scripts/netlify-redirects.mjs"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# No cachear el service worker de FCM para que las actualizaciones lleguen
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
