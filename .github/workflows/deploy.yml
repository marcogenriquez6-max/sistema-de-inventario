name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar con Docker Compose (producción)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Comprobar servidor configurado
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ "${{ secrets.DEPLOY_HOST }}" = "pendiente" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST aún no configurado; se omite el despliegue."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Servidor de despliegue: ${{ secrets.DEPLOY_HOST }}"
          fi

      - name: Copiar código al servidor
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "backend,frontend,database,docker-compose.yml"
          target: "~/repuestos"

      - name: Desplegar
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/repuestos
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f

      - name: Verificación de salud
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sleep 15
            curl -fsS http://localhost:3000/api/health/db || exit 1
            echo "Backend saludable"
